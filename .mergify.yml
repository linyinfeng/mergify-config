# yaml-language-server: $schema=https://docs.mergify.com/mergify-configuration-schema.json
# Consumers in this GitHub account use: extends: mergify-config
merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    merge_method: fast-forward
    update_method: rebase
    batch_size: 1
    # Keep CI here, without separate merge_conditions, for in-place checks.
    # These conditions are checked again after the queue rebases the PR.
    queue_conditions:
      - -draft
      # Summary is informational success, not evidence that CI passed.
      # Keep it in the pending/failure checks: it does not wait for the merge.
      # Live experiment: include the queue action's own check in CI conditions.
      # Only the queue's aggregate lifecycle check is exempted from blocking.
      # Configuration validation and unrelated rule checks still participate.
      # Matching is by check name; reserve these names for Mergify.
      - 'check-success ~= ^(?!(?:Mergify Merge Queue|Summary)$).+'
      - '-check-pending ~= ^(?!Mergify Merge Queue$).+'
      # check-failure also covers cancelled, timed-out and action-required runs.
      - '-check-failure ~= ^(?!Mergify Merge Queue$).+'

pull_request_rules:
  - name: Queue automatic updates
    conditions:
      - -draft
      - or:
          - label = auto update
          - author = dependabot[bot]
    actions:
      queue:
        name: default

# Other PRs can be queued with the checkbox or @mergifyio queue.
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

# Live observation: request configuration diagnostics without changing behavior.
