# yaml-language-server: $schema=https://docs.mergify.com/mergify-configuration-schema.json
# Consumers in this GitHub account use: extends: mergify-config
merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: diagnostic-merge
    merge_method: merge
    batch_size: 1
    queue_conditions:
      - -draft
      - base ~= ^codex/merge-diagnosis
    merge_conditions: &diagnostic_ci
      - "#check-success >= 1"
      - "#check-pending = 0"
      - "#check-failure = 0"
  - name: default
    merge_method: fast-forward
    batch_size: 1
    # Accept the queue request before CI completes.
    queue_conditions:
      - -draft
      - -base ~= ^codex/merge-diagnosis
    # Evaluate CI on the queue's temporary PR before fast-forwarding the base.
    merge_conditions: *diagnostic_ci

pull_request_rules:
  - name: Queue diagnostic merge updates
    conditions:
      - base ~= ^codex/merge-diagnosis
      - or:
          - label = auto update
          - author = dependabot[bot]
    actions:
      queue:
        name: diagnostic-merge
  - name: Queue automatic updates
    conditions:
      - -base ~= ^codex/merge-diagnosis
      - or:
          - label = auto update
          - author = dependabot[bot]
    actions:
      queue:
        name: default

# Other PRs can be queued with the checkbox or @mergifyio queue.
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
